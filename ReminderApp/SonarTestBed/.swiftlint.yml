# This directory is a throwaway test bed (branch test/sonarcloud-detection-check)
# used to verify SonarCloud's own analyzer catches bad Swift patterns
# independently of SwiftLint. Silencing SwiftLint here on purpose so the
# pre-commit hook doesn't block the experiment; SonarCloud's native Swift
# rules are unaffected by these directives.
parent_config: ../../.swiftlint.yml

disabled_rules:
  - force_cast
  - force_try
  - force_unwrapping
  - identifier_name
  - implicitly_unwrapped_optional
  - implicit_optional_initialization
  - legacy_random
  - function_parameter_count
