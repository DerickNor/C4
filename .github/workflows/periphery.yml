name: Periphery (Unused Code)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  periphery:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Periphery
        run: brew install periphery

      - name: Run Periphery
        run: periphery scan --config .periphery.yml --format github-actions
